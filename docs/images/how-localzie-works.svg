<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">Your computer's AI, on your iPhone with Localzie</title>
  <desc id="description">Choose your models and coding agents on your computer. Localzie connects your paired iPhone over home Wi-Fi or a secure remote connection. Your computer stays in charge of running your AI.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f5fbf9"/><stop offset="1" stop-color="#e9f3ef"/></linearGradient>
    <linearGradient id="screen" x2="0.7" y2="1"><stop stop-color="#0b3028"/><stop offset="1" stop-color="#11231f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="12" stdDeviation="16" flood-color="#123b2f" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#43816f" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="570" rx="28" fill="url(#paper)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="60" y="65" font-size="29" font-weight="700" fill="#123b2f">Your computer's AI. In your pocket.</text>
    <text x="60" y="97" font-size="17" fill="#4e6b60">Choose once. Pair your iPhone. Open Localzie wherever you are.</text>
    <!-- Computer and the user's deliberate service choices. -->
    <g filter="url(#shadow)">
      <rect x="65" y="155" width="385" height="264" rx="18" fill="#16372e"/>
      <rect x="76" y="166" width="363" height="240" rx="10" fill="url(#screen)"/>
      <path d="M42 422H473L458 440H60Z" fill="#b8cfc5"/>
      <path d="M207 422H308L299 428H216Z" fill="#87ab9b"/>
    </g>
    <text x="100" y="199" font-size="18" font-weight="650" fill="#ecfaf4">Connect to Localzie</text>
    <text x="100" y="225" font-size="12" fill="#9bbdaf">Choose what you'd like on your iPhone</text>
    <g fill="none" stroke="#71d8b0" stroke-width="1.8">
      <rect x="101" y="251" width="18" height="18" rx="4"/><path d="m105 260 4 4 7-8"/>
      <rect x="101" y="289" width="18" height="18" rx="4"/><path d="m105 298 4 4 7-8"/>
      <rect x="101" y="327" width="18" height="18" rx="4"/><path d="m105 336 4 4 7-8"/>
    </g>
    <text x="132" y="265" font-size="15" fill="#e5f3ed">Your local models</text>
    <text x="132" y="303" font-size="15" fill="#e5f3ed">OpenCode · Hermes</text>
    <text x="132" y="341" font-size="15" fill="#e5f3ed">Codex</text>
    <rect x="101" y="365" width="126" height="25" rx="12.5" fill="#52c59b"/>
    <text x="164" y="382" font-size="11" font-weight="700" text-anchor="middle" fill="#073326">Ready to connect</text>
    <!-- Two routes belong to one secure connection, not two modes. -->
    <path d="M481 254C556 193 665 192 746 254" fill="none" stroke="#43816f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M481 340C556 401 665 402 746 340" fill="none" stroke="#43816f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="531" y="194" width="165" height="35" rx="17.5" fill="#f5fbf9"/>
    <text x="613" y="217" text-anchor="middle" font-size="14" fill="#265a47">Home Wi-Fi</text>
    <rect x="533" y="365" width="161" height="35" rx="17.5" fill="#eef7f2"/>
    <text x="613" y="388" text-anchor="middle" font-size="14" fill="#265a47">Away from home</text>
    <circle cx="614" cy="297" r="38" fill="#d7eee1"/>
    <rect x="601" y="293" width="26" height="23" rx="5" fill="#217f5a"/>
    <path d="M605 293v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#217f5a" stroke-width="4"/>
    <circle cx="614" cy="304" r="2.5" fill="#d7eee1"/>
    <text x="614" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#265a47">One secure connection</text>
    <!-- The app, without copying closed-source product screens. -->
    <g filter="url(#shadow)">
      <rect x="784" y="137" width="207" height="318" rx="32" fill="#16372e"/>
      <rect x="792" y="145" width="191" height="302" rx="25" fill="#fff"/>
      <rect x="851" y="154" width="72" height="15" rx="7.5" fill="#16372e"/>
    </g>
    <circle cx="821" cy="198" r="9" fill="#153f31"/>
    <path d="M815 198a6 6 0 0 0 12 0" fill="none" stroke="#71d8b0" stroke-width="1.6"/>
    <text x="838" y="204" font-size="19" font-weight="700" fill="#143b2e">Localzie</text>
    <text x="810" y="234" font-size="11" fill="#648173">Connected to your computer</text>
    <rect x="831" y="254" width="136" height="49" rx="12" fill="#def2e7"/>
    <text x="842" y="274" font-size="11" fill="#214f3a">Pick up my project</text>
    <text x="842" y="290" font-size="11" fill="#214f3a">where I left off.</text>
    <rect x="809" y="318" width="140" height="63" rx="12" fill="#f0f4f1"/>
    <text x="821" y="339" font-size="11" fill="#214f3a">Your models and agents,</text>
    <text x="821" y="355" font-size="11" fill="#214f3a">with you on your phone.</text>
    <circle cx="818" cy="411" r="3" fill="#35ad7d"/>
    <text x="828" y="415" font-size="10" fill="#648173">Same app. Wherever you are.</text>
    <text x="258" y="482" text-anchor="middle" font-size="18" font-weight="650" fill="#143b2e">Your computer</text>
    <text x="258" y="506" text-anchor="middle" font-size="13" fill="#527363">Runs the models and coding agents you choose</text>
    <text x="888" y="482" text-anchor="middle" font-size="18" font-weight="650" fill="#143b2e">Your iPhone</text>
    <text x="888" y="506" text-anchor="middle" font-size="13" fill="#527363">Localzie brings them with you</text>
    <path d="M60 532H1140" stroke="#cddfd4"/>
    <text x="600" y="553" text-anchor="middle" font-size="12" fill="#527363">Only the services you select. No port forwarding. No phone VPN.</text>
  </g>
</svg>
